<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Stats CurseForge Détaillées</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f97316; margin-bottom: 5px; }
    p.subtitle { color: #a1a1aa; margin-top: 0; margin-bottom: 25px; }
    
    .stats-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 35px;
    }
    .stat-card {
      background: #1e1e1e;
      padding: 15px 25px;
      border-radius: 10px;
      text-align: center;
      min-width: 140px;
      border: 1px solid #2d2d2d;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #f97316;
    }
    .money-value {
      color: #22c55e; /* Vert pour l'argent */
    }
    
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
    .project-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #2d2d2d;
      transition: transform 0.2s;
    }
    .project-card:hover {
      transform: translateY(-4px);
    }
    .project-card img {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .project-card h3 {
      margin: 5px 0 10px 0;
      text-align: center;
      font-size: 1.2rem;
    }
    .badge {
      background: #2a2a2a;
      color: #f97316;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
    .details {
      width: 100%;
      font-size: 0.9rem;
      color: #d4d4d8;
      border-top: 1px solid #2d2d2d;
      padding-top: 10px;
      margin-top: auto;
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }
    .highlight {
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>
