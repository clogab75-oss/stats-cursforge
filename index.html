<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistiques de mon Profil CurseForge</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f97316; }
    .stats-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      min-width: 150px;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #f97316;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .project-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .project-card img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Mes Stats CurseForge</h1>

  <div class="stats-container">
    <div class="stat-card">
      <div>Total Projets</div>
      <div id="total-projects" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div>Total Téléchargements</div>
      <div id="total-downloads" class="stat-value">0</div>
    </div>
  </div>

  <h2>Mes Projets</h2>
  <div id="projects-list" class="projects-grid">
    Chargement de vos projets...
  </div>

  <script>
    // ⚠️ Remplace par ta nouvelle clé si tu la régénères
    const API_KEY = "TON_API_KEY_ICI"; 
    
    // IDs de tes projets CurseForge à afficher (ex: [123456, 789012])
    const MY_PROJECT_IDS = [ /* Colle tes IDs de projets ici */ ];

    async function fetchProfileStats() {
      if (MY_PROJECT_IDS.length === 0) {
        document.getElementById('projects-list').innerHTML = "Veuillez ajouter les IDs de vos projets dans le script.";
        return;
      }

      try {
        const response = await fetch('https://api.curseforge.com/v1/mods', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'x-api-key': API_KEY
          },
          body: JSON.stringify({ modIds: MY_PROJECT_IDS })
        });

        const result = await response.json();
        const mods = result.data;

        let totalDownloads = 0;
        const projectsContainer = document.getElementById('projects-list');
        projectsContainer.innerHTML = '';

        mods.forEach(mod => {
          totalDownloads += mod.downloadCount;

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <img src="${mod.logo ? mod.logo.thumbnailUrl : ''}" alt="${mod.name}">
            <h3>${mod.name}</h3>
            <p><strong>${mod.downloadCount.toLocaleString()}</strong> téléchargements</p>
          `;
          projectsContainer.appendChild(card);
        });

        document.getElementById('total-projects').innerText = mods.length;
        document.getElementById('total-downloads').innerText = totalDownloads.toLocaleString();

      } catch (error) {
        console.error("Erreur d'accès à l'API :", error);
        document.getElementById('projects-list').innerHTML = "Erreur de chargement (Blocage CORS ou Clé API invalide).";
      }
    }

    fetchProfileStats();
  </script>
</body>
</html>
