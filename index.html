<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Stats CurseForge Détaillées</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f97316; margin-bottom: 5px; }
    p.subtitle { color: #a1a1aa; margin-top: 0; margin-bottom: 25px; }
    
    .stats-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 35px;
    }
    .stat-card {
      background: #1e1e1e;
      padding: 15px 25px;
      border-radius: 10px;
      text-align: center;
      min-width: 140px;
      border: 1px solid #2d2d2d;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #f97316;
    }
    
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }
    .project-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #2d2d2d;
      transition: transform 0.2s;
    }
    .project-card:hover {
      transform: translateY(-4px);
    }
    .project-card img {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .project-card h3 {
      margin: 5px 0 10px 0;
      text-align: center;
      font-size: 1.2rem;
    }
    .badge {
      background: #2a2a2a;
      color: #f97316;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
    .details {
      width: 100%;
      font-size: 0.9rem;
      color: #d4d4d8;
      border-top: 1px solid #2d2d2d;
      padding-top: 10px;
      margin-top: auto;
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }
    .highlight {
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Mes Stats CurseForge</h1>
  <p class="subtitle">Tableau de bord en temps réel</p>

  <div class="stats-container">
    <div class="stat-card">
      <div>Projets</div>
      <div id="total-projects" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div>Téléchargements</div>
      <div id="total-downloads" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div>Pièces Estimées 🪙</div>
      <div id="total-points" class="stat-value">0</div>
    </div>
  </div>

  <h2>Détail de mes Projets</h2>
  <div id="projects-list" class="projects-grid">
    Chargement des projets...
  </div>

  <script>
    // 💡 Mets ici les slugs exacts de tes projets depuis CurseForge
    // Exemple : "minecraft/mc-mods/esp-x-ray"
    const MY_PROJECT_SLUGS = [
      "minecraft/mc-mods/esp-x-ray",
      "minecraft/mc-mods/verticals-slabs",
      "minecraft/customization/custom-advancements" 
    ];

    async function fetchStats() {
      const container = document.getElementById('projects-list');
      container.innerHTML = '';

      let totalDownloads = 0;
      let totalPoints = 0;
      let loadedProjects = 0;

      for (const slug of MY_PROJECT_SLUGS) {
        try {
          const response = await fetch(`https://api.cfwidget.com/${slug}`);
          if (!response.ok) continue;

          const data = await response.json();
          
          const downloads = data.downloads.total || 0;
          // Estimation basée sur les barèmes moyens du Reward Program de CurseForge
          const estimatedPoints = Math.round(downloads * 0.05); 
          
          totalDownloads += downloads;
          totalPoints += estimatedPoints;
          loadedProjects++;

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <img src="${data.thumbnail}" alt="${data.title}">
            <h3>${data.title}</h3>
            <span class="badge">${data.game || 'Minecraft'}</span>
            
            <div class="details">
              <div class="details-row">
                <span>📥 Téléchargements :</span>
                <strong>${downloads.toLocaleString()}</strong>
              </div>
              <div class="details-row">
                <span>🪙 Pièces estimées :</span>
                <span class="highlight">+${estimatedPoints.toLocaleString()} pts</span>
              </div>
              <div class="details-row">
                <span>❤️ Suivis / Likes :</span>
                <strong>${(data.followers || 0).toLocaleString()}</strong>
              </div>
              <div class="details-row">
                <span>📅 Mis à jour :</span>
                <strong>${data.last_update || 'Inconnu'}</strong>
              </div>
            </div>
          `;
          container.appendChild(card);
        } catch (err) {
          console.error("Erreur de chargement pour", slug, err);
        }
      }

      document.getElementById('total-projects').innerText = loadedProjects;
      document.getElementById('total-downloads').innerText = totalDownloads.toLocaleString();
      document.getElementById('total-points').innerText = totalPoints.toLocaleString();
    }

    fetchStats();
  </script>
</body>
</html>
