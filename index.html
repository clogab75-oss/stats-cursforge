<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Stats CurseForge</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f97316; }
    .stats-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      min-width: 150px;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #f97316;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .project-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .project-card img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Mes Stats CurseForge</h1>

  <div class="stats-container">
    <div class="stat-card">
      <div>Total Projets</div>
      <div id="total-projects" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div>Total Téléchargements</div>
      <div id="total-downloads" class="stat-value">0</div>
    </div>
  </div>

  <h2>Mes Projets</h2>
  <div id="projects-list" class="projects-grid">
    Chargement de vos projets...
  </div>

  <script>
    // ⚠️ Remplace les éléments ci-dessous par les slugs exacts de tes projets CurseForge
    // Exemple d'URL CurseForge : curseforge.com/minecraft/worlds/mon-monde
    // Le slug est : "worlds/mon-monde"
    const MY_PROJECT_SLUGS = [
      "minecraft/data-packs/custom-advancements",
      "minecraft/mc-mods/esp-x-ray",
      "minecraft/mc-mods/verticals-slabs"
    ];

    async function fetchStats() {
      const container = document.getElementById('projects-list');
      container.innerHTML = '';

      let totalDownloads = 0;
      let loadedProjects = 0;

      for (const slug of MY_PROJECT_SLUGS) {
        try {
          const response = await fetch(`https://api.cfwidget.com/${slug}`);
          if (!response.ok) continue;

          const data = await response.json();
          totalDownloads += data.downloads.total;
          loadedProjects++;

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <img src="${data.thumbnail}" alt="${data.title}">
            <h3>${data.title}</h3>
            <p><strong>${data.downloads.total.toLocaleString()}</strong> téléchargements</p>
          `;
          container.appendChild(card);
        } catch (err) {
          console.error("Erreur avec le projet", slug, err);
        }
      }

      document.getElementById('total-projects').innerText = loadedProjects;
      document.getElementById('total-downloads').innerText = totalDownloads.toLocaleString();
    }

    fetchStats();
  </script>
</body>
</html>
